<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearest-station finder</title>
<style>
  :root { color-scheme: light; }
  body { width: 320px; margin: 0; font: 13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:#0f172a; background:#fff; }
  header { background:linear-gradient(180deg,#0d7a5f,#0a6250); color:#fff; padding:10px 12px; }
  header h1 { margin:0; font-size:13.5px; font-weight:700; }
  header p { margin:2px 0 0; font-size:11px; opacity:.85; }
  main { padding:11px 12px 12px; }
  .route { background:#f1f5f9; border:1px solid #e2e8f0; border-radius:8px; padding:7px 9px; margin-bottom:10px; font-size:12px; }
  .route b { color:#0a6250; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px; }
  label { font-size:12px; color:#334155; }
  select, input[type=number] { font-size:12px; padding:2px 4px; border:1px solid #cbd5e1; border-radius:6px; }
  button { font:600 12px/1 inherit; border:1px solid #0d7a5f; background:#0d7a5f; color:#fff; border-radius:8px; padding:7px 12px; cursor:pointer; }
  button.ghost { background:#fff; color:#0a6250; }
  button:disabled { opacity:.5; cursor:default; }
  .full { width:100%; }
  .msg { font-size:11.5px; color:#475569; background:#f8fafc; border:1px solid #e6ecf1; border-radius:8px; padding:7px 9px; margin-top:8px; }
  .msg.err { background:#fef2f2; border-color:#fecaca; color:#991b1b; }
  .msg.ok { background:#ecfdf5; border-color:#a7f3d0; color:#065f46; }
  footer { border-top:1px solid #eef2f5; padding:8px 12px; display:flex; justify-content:space-between; font-size:11.5px; }
  a { color:#0a6250; cursor:pointer; }
  .checks { display:flex; gap:10px; flex-wrap:wrap; margin:2px 0 9px; }
  .checks label { display:flex; gap:4px; align-items:center; font-size:11.5px; }
</style>
</head>
<body>
<header>
  <h1>🚆 Nearest-station finder</h1>
  <p>When your train is full, look one station up or down the line.</p>
</header>
<main>
  <div class="route" id="route">Open <b>eticket.railway.gov.bd</b> and run a search — the route is picked up automatically.</div>
  <div class="row">
    <label for="hops">Stations before / after</label>
    <select id="hops"><option>1</option><option>2</option><option>3</option></select>
  </div>
  <div class="row">
    <label for="detour">Max detour (km)</label>
    <input id="detour" type="number" min="5" max="300" step="5" style="width:64px">
  </div>
  <div class="checks">
    <label><input type="checkbox" id="dm1"> −1 day</label>
    <label><input type="checkbox" id="dp1"> +1 day</label>
    <label><input type="checkbox" id="dp2"> +2 days</label>
  </div>
  <button class="full" id="run">Find seats now</button>
  <div class="msg" id="msg" style="display:none"></div>
</main>
<footer>
  <a id="options">Settings</a>
  <span id="stats"></span>
</footer>
<script src="popup.js"></script>
</body>
</html>
